name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The mod's checks are the Claude Code CLI's own: neither needs a login.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate the manifests and the modules
        run: |
          claude plugin validate ./code-inspector
          claude plugin validate ./pr-tracker

      - name: Run the tests
        run: |
          claude plugin test ./code-inspector
          claude plugin test ./pr-tracker
